<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nivm — Main Icon (Voice Mode Orb)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090b10;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 40px 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-top: -20px;
        }

        /* Canvas stage */
        .stage {
            width: 480px;
            height: 480px;
            border-radius: 28px;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.25) 100%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .orb-container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Voice Mode Orb Glow */
        .orb-glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(248, 250, 252, 0.4) 32%, transparent 75%);
            filter: blur(48px);
            opacity: 0.88;
            animation: orbPulse 4s ease-in-out infinite alternate;
            transition: all 0.4s ease;
        }

        /* Voice Mode Outer Rotating Rings */
        .orb-rings {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 46% 54% 50% 50% / 55% 45% 55% 45%;
            border: 3.5px solid rgba(255, 255, 255, 0.85);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 70%);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            animation: orbRotate 9s linear infinite;
            z-index: 1;
            transition: all 0.4s ease;
        }

        /* Voice Mode 3D Spherical Core (Pure White Master) */
        .orb-core {
            position: relative;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 35% 35%,
                #ffffff 0%,
                rgba(255, 255, 255, 0.98) 28%,
                #f8fafc 48%,
                #e2e8f0 68%,
                #475569 90%,
                #0f172a 100%
            );
            box-shadow: 
                0 0 35px rgba(255, 255, 255, 0.95),
                0 0 75px rgba(255, 255, 255, 0.5),
                inset -12px -12px 30px rgba(15, 23, 42, 0.65);
            animation: orbFloat 3.5s ease-in-out infinite alternate;
            transition: all 0.4s ease;
            z-index: 2;
        }

        @keyframes orbFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.02); }
        }

        @keyframes orbPulse {
            0% { transform: scale(0.92); opacity: 0.65; }
            100% { transform: scale(1.1); opacity: 0.95; }
        }

        @keyframes orbRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            font-size: 12px;
            color: #94a3b8;
            max-width: 600px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            padding: 8px 16px;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .preset-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            color: #ffffff;
            font-weight: 600;
        }

        .preset-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .sizes-preview {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: 10px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        .size-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <h1>nivm — Voice Orb Icon</h1>
    <p class="subtitle">Main App Icon (Pure White Voice Mode Sphere)</p>
    
    <div class="stage">
        <div class="orb-container" id="orbContainer">
            <div class="orb-glow" id="orbGlow"></div>
            <div class="orb-rings" id="orbRings"></div>
            <div class="orb-core" id="orbCore"></div>
        </div>
    </div>

    <div class="palette">
        <button class="preset-btn active" onclick="applyColor('#ffffff', '#f8fafc', '#cbd5e1', this)">
            <span class="preset-dot" style="background: #ffffff; border: 1px solid rgba(0,0,0,0.2);"></span>Pure White (Default)
        </button>
        <button class="preset-btn" onclick="applyColor('#06b6d4', '#22d3ee', '#0891b2', this)">
            <span class="preset-dot" style="background: #06b6d4;"></span>Cyan
        </button>
        <button class="preset-btn" onclick="applyColor('#a855f7', '#c084fc', '#7e22ce', this)">
            <span class="preset-dot" style="background: #a855f7;"></span>Purple
        </button>
        <button class="preset-btn" onclick="applyColor('#22c55e', '#4ade80', '#15803d', this)">
            <span class="preset-dot" style="background: #22c55e;"></span>Emerald
        </button>
        <button class="preset-btn" onclick="applyColor('#f59e0b', '#fbbf24', '#b45309', this)">
            <span class="preset-dot" style="background: #f59e0b;"></span>Amber
        </button>
    </div>

    <script>
        function applyColor(primary, light, dark, btn) {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const glow = document.getElementById('orbGlow');
            const rings = document.getElementById('orbRings');
            const core = document.getElementById('orbCore');

            if (primary === '#ffffff') {
                glow.style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(248, 250, 252, 0.4) 32%, transparent 75%)';
                rings.style.borderColor = 'rgba(255, 255, 255, 0.85)';
                rings.style.background = 'linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 70%)';
                rings.style.boxShadow = '0 0 30px rgba(255, 255, 255, 0.4)';
                core.style.background = 'radial-gradient(circle at 35% 35%, #ffffff 0%, rgba(255, 255, 255, 0.98) 28%, #f8fafc 48%, #e2e8f0 68%, #475569 90%, #0f172a 100%)';
                core.style.boxShadow = '0 0 35px rgba(255, 255, 255, 0.95), 0 0 75px rgba(255, 255, 255, 0.5), inset -12px -12px 30px rgba(15, 23, 42, 0.65)';
            } else {
                glow.style.background = `radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, ${primary} 40%, transparent 78%)`;
                rings.style.borderColor = 'rgba(255, 255, 255, 0.6)';
                rings.style.background = `linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 70%)`;
                rings.style.boxShadow = `0 0 25px ${primary}`;
                core.style.background = `radial-gradient(circle at 35% 35%, #ffffff 0%, rgba(255, 255, 255, 0.85) 30%, ${primary} 70%, rgba(0, 0, 0, 0.65) 100%)`;
                core.style.boxShadow = `0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px ${primary}, inset -10px -10px 25px rgba(0, 0, 0, 0.6)`;
            }
        }
    </script>
</body>
</html>
